<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="reelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#reelGrad)"/>
  <rect width="1200" height="600" fill="url(#centerGlow)"/>

  <!-- Timeline tracks decoration -->
  <g opacity="0.15">
    <rect x="50" y="440" width="1100" height="25" rx="4" fill="#38bdf8"/>
    <rect x="50" y="475" width="800" height="25" rx="4" fill="#a855f7"/>
    <rect x="150" y="510" width="950" height="25" rx="4" fill="#34d399"/>
    <rect x="50" y="545" width="700" height="25" rx="4" fill="#f43f5e"/>
  </g>

  <!-- Big Play Button -->
  <circle cx="600" cy="270" r="55" fill="#7c3aed" fill-opacity="0.2" stroke="#a855f7" stroke-width="3"/>
  <circle cx="600" cy="270" r="42" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>
  <polygon points="593,254 617,270 593,286" fill="#ffffff"/>

  <text x="600" y="370" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="28" letter-spacing="2">OFFICIAL EDITING SHOWREEL</text>
  <text x="600" y="405" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="16">Watch The Best 90 Seconds Of Pure Visual Storytelling</text>
</svg>