<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="rawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <!-- Dull flat background mimicking unprocessed S-Log raw footage -->
  <rect width="800" height="480" fill="url(#rawGrad)" />
  
  <!-- Faint street / cinematic subject silhouette in flat tone -->
  <circle cx="400" cy="220" r="100" fill="#94a3b8" opacity="0.6"/>
  <path d="M250,480 C270,360 330,300 400,300 C470,300 530,360 550,480 Z" fill="#64748b" opacity="0.7"/>
  <rect x="360" y="140" width="80" height="100" rx="10" fill="#94a3b8" opacity="0.8"/>

  <!-- Technical RAW Grid & Overlays -->
  <line x1="266" y1="0" x2="266" y2="480" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>
  <line x1="533" y1="0" x2="533" y2="480" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>
  <line x1="0" y1="160" x2="800" y2="160" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- Camera HUD info -->
  <rect x="25" y="25" width="140" height="32" rx="6" fill="#0f172a" opacity="0.7"/>
  <text x="35" y="46" fill="#e2e8f0" font-family="monospace" font-weight="bold" font-size="14">● REC [S-LOG3]</text>

  <rect x="620" y="25" width="155" height="32" rx="6" fill="#0f172a" opacity="0.7"/>
  <text x="630" y="46" fill="#e2e8f0" font-family="monospace" font-size="13">ISO 3200 | 4K 24p</text>

  <!-- Big watermark badge -->
  <rect x="30" y="420" width="160" height="36" rx="8" fill="#1e293b" opacity="0.9"/>
  <text x="42" y="443" fill="#cbd5e1" font-family="sans-serif" font-weight="bold" font-size="14">RAW UNGRADED</text>
</svg>