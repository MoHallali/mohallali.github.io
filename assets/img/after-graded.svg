<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="afterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="80%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="65%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#ea580c" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#afterGrad)" />
  <!-- Cinematic Volumetric Flare -->
  <rect width="800" height="480" fill="url(#sunGlow)" />

  <!-- High contrast silhouette with rim lighting (Teal & Orange) -->
  <ellipse cx="400" cy="220" rx="100" ry="100" fill="#090d16"/>
  <ellipse cx="400" cy="220" rx="103" ry="103" fill="none" stroke="#f97316" stroke-width="4" filter="url(#bloom)"/>
  
  <path d="M250,480 C270,360 330,300 400,300 C470,300 530,360 550,480 Z" fill="#030712"/>
  <path d="M250,480 C270,360 330,300 400,300" fill="none" stroke="#38bdf8" stroke-width="5" opacity="0.9" filter="url(#bloom)"/>
  <path d="M400,300 C470,300 530,360 550,480" fill="none" stroke="#fb923c" stroke-width="5" opacity="0.9" filter="url(#bloom)"/>

  <!-- Anamorphic Lens Flare Line -->
  <line x1="0" y1="220" x2="800" y2="220" stroke="#38bdf8" stroke-width="3" opacity="0.6" filter="url(#bloom)"/>
  <line x1="200" y1="220" x2="600" y2="220" stroke="#f8fafc" stroke-width="4" opacity="0.9" filter="url(#bloom)"/>

  <!-- HUD info -->
  <rect x="25" y="25" width="160" height="32" rx="6" fill="#090d16" stroke="#38bdf8" stroke-width="1"/>
  <text x="35" y="46" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="14">MASTER GRADE 4K</text>

  <rect x="620" y="25" width="155" height="32" rx="6" fill="#090d16" stroke="#fb923c" stroke-width="1"/>
  <text x="630" y="46" fill="#fb923c" font-family="monospace" font-size="13">LUT: CINEMA 709</text>

  <!-- Badge -->
  <rect x="30" y="420" width="190" height="36" rx="8" fill="#090d16" stroke="#10b981" stroke-width="1.5"/>
  <text x="42" y="443" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="14">COLOR GRADED + VFX</text>
</svg>